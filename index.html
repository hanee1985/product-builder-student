<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto & Animal Face | Toss Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button id="theme-toggle" class="theme-toggle" title="Toggle Mode">🌙</button>
        
        <section class="lotto-section">
            <h1>로또 번호 생성기</h1>
            <p class="subtitle">행운의 번호 5세트를 확인해보세요</p>
            <div id="lotto-sets" class="lotto-sets">
                <!-- 5 sets will be generated here -->
            </div>
            <button id="generate">새로운 번호 생성하기</button>
        </section>

        <div class="divider"></div>

        <section class="animal-section">
            <h2>동물상 테스트</h2>
            <p class="subtitle">사진을 업로드하여 강아지상/고양이상을 확인해보세요</p>
            <div class="animal-container">
                <div class="file-upload-wrapper">
                    <input type='file' id="image-upload" accept="image/*" onchange="readURL(this);" />
                    <label for="image-upload" class="upload-btn">사진 선택하기</label>
                </div>
                <img id="face-image" src="#" alt="your image" style="display:none;" />
                
                <div id="loading-container" style="display:none; width: 100%; margin-top: 20px;">
                    <p class="loading-text">AI가 당신의 관상을 분석 중입니다...</p>
                    <div class="analysis-progress-bar">
                        <div class="analysis-progress-value"></div>
                    </div>
                </div>

                <div id="label-container"></div>
            </div>
        </section>

        <div class="divider"></div>

        <section class="partnership-section">
            <h2>제휴 문의</h2>
            <p class="subtitle">비즈니스 제휴 및 협업 문의를 남겨주세요</p>
            <form action="https://formspree.io/f/xvzbqnrq" method="POST" class="inquiry-form">
                <div class="form-group">
                    <label for="email">이메일 주소</label>
                    <input type="email" name="email" id="email" placeholder="example@toss.im" required>
                </div>
                <div class="form-group">
                    <label for="message">문의 내용</label>
                    <textarea name="message" id="message" rows="4" placeholder="문의하실 내용을 입력해주세요" required></textarea>
                </div>
                <button type="submit" class="submit-btn">문의 보내기</button>
            </form>
        </section>

        <div class="divider"></div>

        <section class="comment-section">
            <h2>댓글</h2>
            <div id="disqus_thread"></div>
            <script>
                (function() {
                var d = document, s = d.createElement('script');
                s.src = 'https://productowner-1.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                })();
            </script>
            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </section>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="main.js"></script>
    <script src="animal.js"></script>
</body>
</html>
